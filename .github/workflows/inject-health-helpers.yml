name: Inject health helpers
on:
  push:
    branches:
      - fix/non-destructive-health-migrations
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/non-destructive-health-migrations
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          set -e
          python3 tools/inject_health_helpers.py
          rm -f tools/inject_health_helpers.py tools/non_destructive_health_mig.py .github/workflows/inject-health-helpers.yml .github/workflows/non-destructive-health.yml
          rmdir tools 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo no change
          else
            git commit -m "fix: add non-destructive wellness/health ensure methods"
            git push origin fix/non-destructive-health-migrations
          fi
