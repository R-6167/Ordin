name: Fix wellness schema day column
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Patch schema and ship PR branch
        run: |
          set -euo pipefail
          git checkout -B fix/wellness-schema-day
          python3 tools/fix_wellness_schema.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/flutter/assets/schema.sql apps/flutter/lib/data/database.dart
          git commit -m "fix: align wellness_checkins with day column (schema v27)"
          git push -u origin HEAD:fix/wellness-schema-day --force
