name: Phase 7 HomeShell patch
on:
  push:
    branches:
      - phase7/refresh-stabilize
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase7/refresh-stabilize
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply Phase 7 HomeShell patch
        run: |
          set -e
          python3 tools/phase7_patch_home_shell.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/flutter/lib/ui/home_shell.dart
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "fix(phase-7): debounce AppDataBus reloads + stable tab keys"
            git push origin phase7/refresh-stabilize
          fi
