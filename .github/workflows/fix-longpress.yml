name: Fix longpress
on:
  push:
    branches:
      - feature/milestone-due-dates
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/milestone-due-dates
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          set -e
          python3 tools/fix_iconbutton_longpress.py
          rm -f tools/fix_iconbutton_longpress.py .github/workflows/fix-longpress.yml
          rmdir tools 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo no change
          else
            git commit -m "fix: due date menu instead of IconButton.onLongPress"
            git push origin feature/milestone-due-dates
          fi
