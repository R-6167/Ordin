name: Phase 7 narrow domains
on:
  push:
    branches:
      - phase7/narrow-domains
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase7/narrow-domains
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Narrow life reload
        run: |
          set -e
          python3 tools/phase7_narrow_life_reload.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/flutter/lib/ui/home_shell.dart
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "fix(phase-7): load life lists only when life domain dirty"
            git push origin phase7/narrow-domains
          fi
