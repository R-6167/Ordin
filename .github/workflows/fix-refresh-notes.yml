name: Fix refresh double-load and notes scan
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Patch
        run: |
          set -euo pipefail
          git checkout -B fix/refresh-notes-finish
          python3 tools/fix_refresh_notes.py
          python3 - <<'PY'
          from pathlib import Path
          for p in [
            'apps/flutter/lib/ui/home_shell.dart',
            'apps/flutter/lib/ui/screens/note_detail_screen.dart',
            'apps/flutter/lib/ui/screens/planning_screen.dart',
          ]:
            s = Path(p).read_text()
            assert s.count('(') == s.count(')'), (p, s.count('('), s.count(')'))
            assert s.count('{') == s.count('}'), (p, s.count('{'), s.count('}'))
            print(p, 'ok')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stop double shell reload, note on-demand scan, harden extract tasks"
          git push -u origin HEAD:fix/refresh-notes-finish --force
