name: Stable task keys
on:
  push:
    branches:
      - fix/stable-task-list-keys
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stable-task-list-keys
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch
        run: |
          set -e
          git fetch origin main --depth=1 || true
          python3 tools/stable_task_keys.py
          rm -f tools/stable_task_keys.py .github/workflows/stable-task-keys.yml
          rmdir tools 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo no change
          else
            git commit -m "fix: ValueKey on task/plan list cards + ROADMAP W3/W5 done"
            git push origin fix/stable-task-list-keys
          fi
