name: Non-destructive health migrations
on:
  push:
    branches:
      - fix/non-destructive-health-migrations
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/non-destructive-health-migrations
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply
        run: |
          set -e
          git fetch origin main --depth=1 || true
          python3 tools/non_destructive_health_mig.py
          rm -f tools/non_destructive_health_mig.py .github/workflows/non-destructive-health.yml
          rmdir tools 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo no change
          else
            git commit -m "fix: non-destructive wellness/health migrations (copy+validate)"
            git push origin fix/non-destructive-health-migrations
          fi
