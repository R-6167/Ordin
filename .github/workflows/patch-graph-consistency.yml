name: Patch graph consistency
on:
  push:
    branches:
      - fix/project-milestone-graph-consistency
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/project-milestone-graph-consistency
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          set -e
          python3 tools/patch_graph_consistency.py
          rm -f tools/patch_graph_consistency.py .github/workflows/patch-graph-consistency.yml
          rmdir tools 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo no change
          else
            git commit -m "fix: task reassignment clears bad links; deps same project; project reopen"
            git push origin fix/project-milestone-graph-consistency
          fi
