name: W1 refresh + schedule fix
on:
  push:
    branches:
      - fix/w1-refresh-honesty-schedule-list
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/w1-refresh-honesty-schedule-list
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore and patch
        run: |
          set -e
          git fetch origin main --depth=1
          git checkout origin/main -- apps/flutter/lib/services/build_my_day.dart
          python3 tools/w1_refresh_and_schedule.py
          rm -f tools/w1_refresh_and_schedule.py .github/workflows/w1-refresh-schedule.yml
          rmdir tools 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "fix(w1): domain-scoped FAB, expense on-ok refresh, growable day lists"
            git push origin fix/w1-refresh-honesty-schedule-list
          fi
