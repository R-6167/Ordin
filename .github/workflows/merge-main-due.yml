name: Merge main due dates
on:
  push:
    branches:
      - feature/milestone-due-dates
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/milestone-due-dates
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge + patch
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 tools/rebase_due_on_main.py
          rm -f tools/rebase_due_on_main.py .github/workflows/merge-main-due.yml
          rmdir tools 2>/dev/null || true
          # touch to ensure flutter path triggers APK on PR
          echo "// due-dates merge $(date -u +%Y%m%d%H%M%S)" >> apps/flutter/lib/data/milestone_repository.dart
          # remove the touch comment line we just added if file ends oddly — keep setDue
          git add -A
          if git diff --cached --quiet; then
            echo no change
          else
            git commit -m "fix: merge main + due dates with progress bars (no onLongPress)"
            git push origin feature/milestone-due-dates
          fi
