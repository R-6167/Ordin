name: Merge main due dates
on:
  push:
    branches:
      - feature/milestone-due-dates
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/milestone-due-dates
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge + patch
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 tools/rebase_due_on_main.py
          rm -f tools/rebase_due_on_main.py .github/workflows/merge-main-due.yml
          rmdir tools 2>/dev/null || true
          git add -A
          if test -f .git/MERGE_HEAD; then
            git commit -m "merge main; due dates + progress bars (no onLongPress)" || true
          elif ! git diff --cached --quiet; then
            git commit -m "fix: due dates with progress bars (no onLongPress)"
          fi
          git push origin feature/milestone-due-dates
