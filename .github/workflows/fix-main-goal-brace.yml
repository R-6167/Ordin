name: Fix goal detail braces on main branch tip
on:
  push:
    branches: [fix/goal-detail-state-brace]
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/goal-detail-state-brace
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          set -e
          python3 tools/fix_main_goal_brace.py
          rm -f tools/fix_main_goal_brace.py .github/workflows/fix-main-goal-brace.yml
          rmdir tools 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo no change
          else
            git commit -m "fix: keep _evidenceChip and _archiveGoal inside GoalDetail State"
            git push origin fix/goal-detail-state-brace
          fi
