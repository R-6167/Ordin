name: Patch life-area archived filter
on:
  push:
    branches: [fix/life-area-hide-archived]
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/life-area-hide-archived
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          set -e
          python3 tools/patch_life_area_archived.py
          rm -f tools/patch_life_area_archived.py .github/workflows/patch-life-area-archived.yml
          rmdir tools 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo no change
          else
            git commit -m "fix: listByLifeArea excludes archived_at goals and projects"
            git push origin fix/life-area-hide-archived
          fi
