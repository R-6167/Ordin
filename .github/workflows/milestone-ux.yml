name: Milestone UX
on:
  push:
    branches:
      - feature/milestone-ux
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/milestone-ux
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply
        run: |
          set -e
          git fetch origin main --depth=1 || true
          python3 tools/milestone_ux_patcher.py
          rm -f tools/milestone_ux_patcher.py tools/milestone_repo_extra.dart .github/workflows/milestone-ux.yml
          rmdir tools 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo no change
          else
            git commit -m "feat: milestone UX — stages, nested tasks, rename, reopen"
            git push origin feature/milestone-ux
          fi
