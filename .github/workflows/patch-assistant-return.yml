name: Patch assistant return
on:
  push:
    branches:
      - fix/scoped-assistant-return-reload
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scoped-assistant-return-reload
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          set -e
          python3 tools/patch_assistant_return.py
          rm -f tools/patch_assistant_return.py .github/workflows/patch-assistant-return.yml
          rmdir tools 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo no change
          else
            git commit -m "fix: HomeShell scoped reload after assistant (no all-domain fallback)"
            git push origin fix/scoped-assistant-return-reload
          fi
