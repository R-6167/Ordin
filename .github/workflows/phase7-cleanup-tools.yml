name: Phase 7 cleanup tools
on:
  push:
    branches:
      - phase7/cleanup-sonar-tools
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase7/cleanup-sonar-tools
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove one-off tools and patch workflows
        run: |
          set -e
          rm -f tools/fix_empty_states.py \
                tools/fix_migrate_v26.py \
                tools/fix_refresh_notes.py \
                tools/fix_ux_batch.py \
                tools/fix_wellness_schema.py \
                tools/patch_life_screens.py \
                tools/phase4_execution_unify.py \
                tools/phase4_finish.py \
                tools/phase7_narrow_life_reload.py \
                tools/phase7_patch_home_shell.py \
                tools/polish_goal_project.py
          rm -f .github/workflows/phase7-home-shell-patch.yml \
                .github/workflows/phase7-narrow-domains.yml \
                .github/workflows/restore-task-detail.yml \
                .github/workflows/phase7-cleanup-tools.yml
          # Keep tools/ if other files remain
          rmdir tools 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to remove"
          else
            git commit -m "chore(phase-7): remove one-off tools/ scripts (Sonar path-traversal noise)"
            git push origin phase7/cleanup-sonar-tools
          fi
