name: W4 record expense
on:
  push:
    branches:
      - fix/w4-record-expense
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/w4-record-expense
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply W4 patches
        run: |
          set -e
          git fetch origin main --depth=1 || true
          python3 tools/w4_record_expense.py
          rm -f tools/w4_record_expense.py .github/workflows/w4-record-expense.yml
          rmdir tools 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo no change
          else
            git commit -m "fix(w4): expense/income validation, snackbars, ok-only refresh"
            git push origin fix/w4-record-expense
          fi
