name: Fix planning navigator syntax
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/refresh-notes-finish
      - name: Repair onTap Navigator chain
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          p = Path('apps/flutter/lib/ui/screens/planning_screen.dart')
          lines = p.read_text().splitlines(keepends=True)
          out = []
          i = 0
          fixed = False
          while i < len(lines):
              line = lines[i]
              # Detect broken sequence starting at Navigator.of(context)
              if (
                  not fixed
                  and 'Navigator.of(context)' in line
                  and i + 1 < len(lines)
                  and 'generationBefore' in lines[i + 1]
              ):
                  indent = '                                '
                  out.append(indent + 'final generationBefore = AppDataBus.instance.generation;\n')
                  out.append(indent + 'Navigator.of(context)\n')
                  out.append(indent + '    .push(MaterialPageRoute(\n')
                  out.append(indent + '        builder: (_) => TaskDetailScreen(taskId: t.id)))\n')
                  out.append(indent + '    .then((_) async {\n')
                  out.append(indent + '  if (AppDataBus.instance.generation != generationBefore) {\n')
                  out.append(indent + '    await _load();\n')
                  out.append(indent + '  }\n')
                  out.append(indent + '});\n')
                  # skip original broken lines until after the .then line
                  i += 1
                  while i < len(lines) and '.then(' not in lines[i]:
                      i += 1
                  if i < len(lines):
                      i += 1  # skip .then line
                  fixed = True
                  continue
              out.append(line)
              i += 1
          if not fixed:
              raise SystemExit('did not find broken navigator block')
          text = ''.join(out)
          assert text.count('(') == text.count(')'), (text.count('('), text.count(')'))
          assert text.count('{') == text.count('}'), (text.count('{'), text.count('}'))
          p.write_text(text)
          print('fixed')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/flutter/lib/ui/screens/planning_screen.dart
          git commit -m "fix: repair planning task open Navigator chain"
          git push origin HEAD:fix/refresh-notes-finish
