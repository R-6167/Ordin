name: Cleanup stale workflows once
on:
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Delete one-shot workflows
        run: |
          set -euo pipefail
          cd .github/workflows
          keep='ci.yml flutter-apk.yml generate-pubspec-lock.yml cleanup-stale-workflows-once.yml'
          for f in *.yml; do
            skip=0
            for k in $keep; do
              if [ "$f" = "$k" ]; then skip=1; break; fi
            done
            if [ $skip -eq 0 ]; then
              echo "DELETE $f"
              rm -f "$f"
            else
              echo "KEEP $f"
            fi
          done
          # also remove this self-destruct after commit
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "ci: delete stale one-shot workflows (stop red noise on main)" || echo nochange
          # remove the cleanup workflow itself in same commit if still present
          if [ -f cleanup-stale-workflows-once.yml ]; then
            rm -f cleanup-stale-workflows-once.yml
            git add -A
            git commit --amend --no-edit || true
          fi
          git push origin HEAD:main
