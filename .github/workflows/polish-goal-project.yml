name: Polish goal evidence project blocked
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Patch
        run: |
          set -euo pipefail
          git checkout -B polish/goal-project-evidence
          python3 tools/polish_goal_project.py
          python3 - <<'PY'
          from pathlib import Path
          for p in [
            'apps/flutter/lib/ui/screens/goal_detail_screen.dart',
            'apps/flutter/lib/ui/screens/project_detail_screen.dart',
          ]:
            s = Path(p).read_text()
            assert s.count('(') == s.count(')'), (p, s.count('('), s.count(')'))
            assert s.count('{') == s.count('}'), (p, s.count('{'), s.count('}'))
            print(p, 'ok')
          assert 'Progress evidence' in Path('apps/flutter/lib/ui/screens/goal_detail_screen.dart').read_text()
          assert 'Blocked open work' in Path('apps/flutter/lib/ui/screens/project_detail_screen.dart').read_text()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/flutter/lib/ui/screens/goal_detail_screen.dart apps/flutter/lib/ui/screens/project_detail_screen.dart
          git commit -m "feat: goal progress evidence + project blocked open work"
          git push -u origin HEAD:polish/goal-project-evidence --force
