name: Milestone due dates
on:
  push:
    branches:
      - feature/milestone-due-dates
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/milestone-due-dates
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply
        run: |
          set -e
          git fetch origin main --depth=1 || true
          python3 tools/milestone_due_dates.py
          rm -f tools/milestone_due_dates.py .github/workflows/milestone-due-dates.yml
          rmdir tools 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo no change
          else
            git commit -m "feat: milestone due dates (schema v29 + setDue + UI)"
            git push origin feature/milestone-due-dates
          fi
