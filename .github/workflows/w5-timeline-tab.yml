name: W5 Timeline tab
on:
  push:
    branches:
      - feature/w5-timeline-tab
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/w5-timeline-tab
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply W5
        run: |
          set -e
          git fetch origin main --depth=1 || true
          python3 tools/w5_timeline_tab.py
          # sanity: file must not contain backslash-quote artifacts
          if grep -q "\\\\'" apps/flutter/lib/ui/hubs/more_hub.dart 2>/dev/null; then
            echo "bad escapes in more_hub" >&2
            exit 1
          fi
          rm -f tools/w5_timeline_tab.py .github/workflows/w5-timeline-tab.yml
          rmdir tools 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo no change
          else
            git commit -m "feat(w5): More tab becomes Timeline (activity + suggestions)"
            git push origin feature/w5-timeline-tab
          fi
